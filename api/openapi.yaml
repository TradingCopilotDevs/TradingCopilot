      responses:
        "200": { $ref: "#/components/responses/MarketQuoteDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
        "404": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /market/series/{code}:
