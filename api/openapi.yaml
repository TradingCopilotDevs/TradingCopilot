      name: group
      in: query
      schema: { type: string }
    LogMethod:
      name: method
      in: query
      schema: { type: string }
    LogPath:
      name: path
      in: query
      schema: { type: string }
    LogStatus:
      name: status
      in: query
      schema: { type: string }
