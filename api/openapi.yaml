        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /market/tasks:
    post:
      operationId: postMarketTasks
      requestBody: { $ref: "#/components/requestBodies/MarketTaskRequest" }
      responses:
        "202": { $ref: "#/components/responses/MarketTaskDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
        "409": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /market/symbols/{code}:
    put:
      operationId: putMarketSymbol
