openapi: 3.0.3
info:
  title: TradingCopilot API
  version: 0.1.0
  description: JSON:API contract target for the Go modular monolith migration.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200": { $ref: "#/components/responses/HealthDocument" }
  /auth/bootstrap-required:
    get:
      operationId: getAuthBootstrapRequired
      security: []
      responses:
        "200": { $ref: "#/components/responses/AuthBootstrapStateDocument" }
  /auth/bootstrap:
    post:
      operationId: postAuthBootstrap
      security: []
      requestBody: { $ref: "#/components/requestBodies/AuthCredentialsRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthTokenDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
        "409": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /auth/login:
    post:
      operationId: postAuthLogin
      security: []
      requestBody: { $ref: "#/components/requestBodies/AuthCredentialsRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthTokenDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
        "401": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        "200": { $ref: "#/components/responses/DashboardDocument" }
  /logs:
    get:
      operationId: getLogs
      parameters:
        - $ref: "#/components/parameters/LogFrom"
        - $ref: "#/components/parameters/LogTo"
        - $ref: "#/components/parameters/LogLevel"
        - $ref: "#/components/parameters/LogRole"
        - $ref: "#/components/parameters/LogSource"
        - $ref: "#/components/parameters/LogEvent"
        - $ref: "#/components/parameters/LogGroup"
        - $ref: "#/components/parameters/LogMethod"
        - $ref: "#/components/parameters/LogPath"
        - $ref: "#/components/parameters/LogStatus"
        - $ref: "#/components/parameters/LogSlowOnly"
        - $ref: "#/components/parameters/LogIncludeNoise"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/LogFile"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/LogEntryCollectionDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /logs/files:
    get:
      operationId: getLogFiles
      responses:
        "200": { $ref: "#/components/responses/LogFileCollectionDocument" }
  /settings/runtime-env:
    get:
      operationId: getSettingsRuntimeEnv
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/RuntimeEnvCollectionDocument" }
  /settings/secret-definitions:
    get:
      operationId: getSettingsSecretDefinitions
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/SecretDefinitionCollectionDocument" }
  /settings/secrets:
    get:
      operationId: getSettingsSecrets
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/SecretCollectionDocument" }
    post:
      operationId: postSettingsSecrets
      requestBody: { $ref: "#/components/requestBodies/SecretUpsertRequest" }
      responses:
        "200": { $ref: "#/components/responses/SecretDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /settings/app-settings:
    get:
      operationId: getSettingsAppSettings
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/AppSettingCollectionDocument" }
  /settings/app-settings/{key}:
    put:
      operationId: putSettingsAppSetting
      parameters:
        - $ref: "#/components/parameters/Key"
      requestBody: { $ref: "#/components/requestBodies/AppSettingUpsertRequest" }
      responses:
        "200": { $ref: "#/components/responses/AppSettingDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
        "500": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /settings/proxy:
    get:
      operationId: getSettingsProxy
      responses:
        "200": { $ref: "#/components/responses/ProxySettingDocument" }
    put:
      operationId: putSettingsProxy
      requestBody: { $ref: "#/components/requestBodies/ProxySettingRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProxySettingDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /settings/proxy/test:
    post:
      operationId: postSettingsProxyTest
      responses:
        "200": { $ref: "#/components/responses/ProxyTestDocument" }
  /ai/providers:
    get:
      operationId: getAiProviders
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/AiProviderCollectionDocument" }
    post:
      operationId: postAiProviders
      requestBody: { $ref: "#/components/requestBodies/AiProviderUpsertRequest" }
      responses:
        "200": { $ref: "#/components/responses/AiProviderDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /ai/providers/{providerId}:
    put:
      operationId: putAiProvider
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody: { $ref: "#/components/requestBodies/AiProviderUpsertRequest" }
      responses:
        "200": { $ref: "#/components/responses/AiProviderDocument" }
        "404": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /ai/providers/{providerId}/models:
    get:
      operationId: getAiProviderModels
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/AiProviderModelCollectionDocument" }
  /ai/providers/{providerId}/models/sync:
    post:
      operationId: postAiProviderModelsSync
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      responses:
        "200": { $ref: "#/components/responses/AiProviderModelCollectionDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
        "404": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /ai/tool-definitions:
    get:
      operationId: getAiToolDefinitions
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/AiToolDefinitionCollectionDocument" }
  /ai/skill-definitions:
    get:
      operationId: getAiSkillDefinitions
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
