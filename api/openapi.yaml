openapi: 3.0.3
info:
  title: TradingCopilot API
  version: 0.1.0
  description: JSON:API contract target for the Go modular monolith migration.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200": { $ref: "#/components/responses/HealthDocument" }
  /auth/bootstrap-required:
    get:
      operationId: getAuthBootstrapRequired
      security: []
      responses:
        "200": { $ref: "#/components/responses/AuthBootstrapStateDocument" }
  /auth/bootstrap:
    post:
      operationId: postAuthBootstrap
      security: []
      requestBody: { $ref: "#/components/requestBodies/AuthCredentialsRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthTokenDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
        "409": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /auth/login:
    post:
      operationId: postAuthLogin
      security: []
      requestBody: { $ref: "#/components/requestBodies/AuthCredentialsRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthTokenDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
        "401": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /auth/logout:
    post:
      operationId: postAuthLogout
      responses:
        "200": { $ref: "#/components/responses/AuthSessionDocument" }
        "401": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /admin/users:
    get:
      operationId: getAdminUsers
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/AdminUserCollectionDocument" }
    post:
      operationId: postAdminUsers
      requestBody: { $ref: "#/components/requestBodies/AdminUserCreateRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminUserDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
        "409": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /admin/users/{userId}:
    put:
      operationId: putAdminUser
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody: { $ref: "#/components/requestBodies/AdminUserUpdateRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminUserDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
        "404": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /admin/users/{userId}/password-reset:
    post:
      operationId: postAdminUserPasswordReset
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody: { $ref: "#/components/requestBodies/AdminUserPasswordResetRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminUserDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
        "404": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /admin/sessions:
    get:
      operationId: getAdminSessions
      parameters:
        - $ref: "#/components/parameters/Username"
        - $ref: "#/components/parameters/IncludeRevoked"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/AuthSessionCollectionDocument" }
  /admin/sessions/{sessionId}/revoke:
    post:
      operationId: postAdminSessionRevoke
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody: { $ref: "#/components/requestBodies/AuthSessionRevokeRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthSessionDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
        "404": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /audit-events:
    get:
      operationId: getAuditEvents
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/AuditEventCollectionDocument" }
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        "200": { $ref: "#/components/responses/DashboardDocument" }
  /setup/readiness:
    get:
      operationId: getSetupReadiness
      responses:
        "200": { $ref: "#/components/responses/SetupReadinessDocument" }
  /setup/actions/{key}:
    post:
      operationId: postSetupAction
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200": { $ref: "#/components/responses/SetupActionResultDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
        "404": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /ops/provider-health:
    get:
      operationId: getOpsProviderHealth
      responses:
        "200": { $ref: "#/components/responses/OpsProviderHealthDocument" }
  /ops/jobs:
    get:
      operationId: getOpsJobs
      parameters:
        - $ref: "#/components/parameters/OpsQueueName"
        - $ref: "#/components/parameters/OpsTaskType"
        - $ref: "#/components/parameters/OpsTaskState"
        - $ref: "#/components/parameters/OpsFailedLimit"
      responses:
        "200": { $ref: "#/components/responses/OpsJobsDocument" }
  /ops/jobs/retry-failed:
    post:
      operationId: postOpsJobsRetryFailed
      responses:
        "200": { $ref: "#/components/responses/OpsJobActionDocument" }
        "409": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /ops/jobs/{queue}/tasks/{taskId}/run:
    post:
      operationId: postOpsJobTaskRun
      parameters:
        - $ref: "#/components/parameters/Queue"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200": { $ref: "#/components/responses/OpsJobActionDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
        "409": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /ops/metrics:
    get:
      operationId: getOpsMetrics
      responses:
        "200":
          description: Prometheus text metrics for protected operational scraping.
          content:
            text/plain:
              schema: { type: string }
  /ops/backups:
    get:
      operationId: getOpsBackups
      responses:
        "200": { $ref: "#/components/responses/OpsBackupsDocument" }
    post:
      operationId: postOpsBackups
      responses:
        "200": { $ref: "#/components/responses/OpsBackupRunDocument" }
        "500": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /ops/backups/{backupName}/restore-dry-run:
    post:
      operationId: postOpsBackupRestoreDryRun
      parameters:
        - $ref: "#/components/parameters/BackupName"
      responses:
        "200": { $ref: "#/components/responses/OpsBackupRestoreDryRunDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
        "404": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /logs:
    get:
      operationId: getLogs
      parameters:
        - $ref: "#/components/parameters/LogFrom"
        - $ref: "#/components/parameters/LogTo"
        - $ref: "#/components/parameters/LogLevel"
        - $ref: "#/components/parameters/LogRole"
        - $ref: "#/components/parameters/LogSource"
        - $ref: "#/components/parameters/LogEvent"
        - $ref: "#/components/parameters/LogGroup"
        - $ref: "#/components/parameters/LogMethod"
        - $ref: "#/components/parameters/LogPath"
        - $ref: "#/components/parameters/LogStatus"
        - $ref: "#/components/parameters/LogSlowOnly"
        - $ref: "#/components/parameters/LogIncludeNoise"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/LogFile"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/LogEntryCollectionDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /logs/files:
    get:
      operationId: getLogFiles
      responses:
        "200": { $ref: "#/components/responses/LogFileCollectionDocument" }
  /settings/runtime-env:
    get:
      operationId: getSettingsRuntimeEnv
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/RuntimeEnvCollectionDocument" }
  /settings/secret-definitions:
    get:
      operationId: getSettingsSecretDefinitions
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/SecretDefinitionCollectionDocument" }
  /settings/secrets:
    get:
      operationId: getSettingsSecrets
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/SecretCollectionDocument" }
    post:
      operationId: postSettingsSecrets
      requestBody: { $ref: "#/components/requestBodies/SecretUpsertRequest" }
      responses:
        "200": { $ref: "#/components/responses/SecretDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /settings/app-settings:
    get:
      operationId: getSettingsAppSettings
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/AppSettingCollectionDocument" }
  /settings/app-settings/{key}:
    put:
      operationId: putSettingsAppSetting
      parameters:
        - $ref: "#/components/parameters/Key"
      requestBody: { $ref: "#/components/requestBodies/AppSettingUpsertRequest" }
      responses:
        "200": { $ref: "#/components/responses/AppSettingDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
        "500": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /settings/proxy:
    get:
      operationId: getSettingsProxy
      responses:
        "200": { $ref: "#/components/responses/ProxySettingDocument" }
    put:
      operationId: putSettingsProxy
      requestBody: { $ref: "#/components/requestBodies/ProxySettingRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProxySettingDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /settings/proxy/test:
    post:
      operationId: postSettingsProxyTest
      responses:
        "200": { $ref: "#/components/responses/ProxyTestDocument" }
  /ai/providers:
    get:
      operationId: getAiProviders
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/AiProviderCollectionDocument" }
    post:
      operationId: postAiProviders
      requestBody: { $ref: "#/components/requestBodies/AiProviderUpsertRequest" }
      responses:
        "200": { $ref: "#/components/responses/AiProviderDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /ai/providers/{providerId}:
    put:
      operationId: putAiProvider
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody: { $ref: "#/components/requestBodies/AiProviderUpsertRequest" }
      responses:
        "200": { $ref: "#/components/responses/AiProviderDocument" }
        "404": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /ai/providers/{providerId}/models:
    get:
      operationId: getAiProviderModels
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/AiProviderModelCollectionDocument" }
  /ai/providers/{providerId}/models/sync:
    post:
      operationId: postAiProviderModelsSync
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      responses:
        "200": { $ref: "#/components/responses/AiProviderModelCollectionDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
        "404": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /ai/tool-definitions:
    get:
      operationId: getAiToolDefinitions
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/AiToolDefinitionCollectionDocument" }
  /ai/skill-definitions:
    get:
      operationId: getAiSkillDefinitions
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/AiSkillDefinitionCollectionDocument" }
  /ai/roles:
    get:
      operationId: getAiRoles
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/AiRoleCollectionDocument" }
  /ai/roles/apply-default-capabilities:
    post:
      operationId: postAiRolesApplyDefaultCapabilities
      responses:
        "200": { $ref: "#/components/responses/AiRoleCapabilityUpdateDocument" }
  /ai/roles/{roleKey}:
    put:
      operationId: putAiRole
      parameters:
        - $ref: "#/components/parameters/RoleKey"
      requestBody: { $ref: "#/components/requestBodies/AiRoleUpsertRequest" }
      responses:
        "200": { $ref: "#/components/responses/AiRoleDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /research-teams:
    get:
      operationId: getResearchTeams
      responses:
        "200": { $ref: "#/components/responses/ResearchTeamCollectionDocument" }
    post:
      operationId: postResearchTeams
      requestBody: { $ref: "#/components/requestBodies/ResearchTeamUpsertRequest" }
      responses:
        "200": { $ref: "#/components/responses/ResearchTeamDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /research-teams/{teamId}:
    put:
      operationId: putResearchTeam
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody: { $ref: "#/components/requestBodies/ResearchTeamUpsertRequest" }
      responses:
        "200": { $ref: "#/components/responses/ResearchTeamDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
        "404": { $ref: "#/components/responses/JsonApiErrorDocument" }
    delete:
      operationId: deleteResearchTeam
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200": { $ref: "#/components/responses/DeletionDocument" }
        "409": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /research-teams/{teamId}/roles:
    get:
      operationId: getResearchTeamRoles
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200": { $ref: "#/components/responses/ResearchTeamRoleCollectionDocument" }
  /research-teams/{teamId}/roles/apply-defaults:
    post:
      operationId: postResearchTeamRolesApplyDefaults
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200": { $ref: "#/components/responses/ResearchTeamRoleCollectionDocument" }
        "404": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /research-teams/{teamId}/roles/{roleKey}:
    put:
      operationId: putResearchTeamRole
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/RoleKey"
      requestBody: { $ref: "#/components/requestBodies/ResearchTeamRoleUpsertRequest" }
      responses:
        "200": { $ref: "#/components/responses/ResearchTeamRoleDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
    delete:
      operationId: deleteResearchTeamRole
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/RoleKey"
      responses:
        "200": { $ref: "#/components/responses/DeletionDocument" }
  /market/symbols:
    get:
      operationId: getMarketSymbols
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/MarketSymbolCollectionDocument" }
    post:
      operationId: postMarketSymbols
      requestBody: { $ref: "#/components/requestBodies/MarketSymbolUpsertRequest" }
      responses:
        "200": { $ref: "#/components/responses/MarketSymbolDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
        "409": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /market/symbols/sync:
