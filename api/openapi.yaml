        "200": { $ref: "#/components/responses/DeletionDocument" }
  /market/tools/query:
    post:
      operationId: postMarketToolsQuery
      requestBody: { $ref: "#/components/requestBodies/MarketToolQueryRequest" }
      responses:
        "200": { $ref: "#/components/responses/MarketToolResultCollectionDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /message-subscriptions/app-config:
