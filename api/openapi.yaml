          $ref: "#/components/schemas/PaperBacktestPolicy"
        summary:
          $ref: "#/components/schemas/PaperBacktestSummary"
        series:
          type: array
          items:
            $ref: "#/components/schemas/PaperBacktestPoint"
        orders:
          type: array
          items:
            $ref: "#/components/schemas/PaperBacktestOrder"
    PaperBacktestInput:
      type: object
      properties:
        accountId: { type: integer }
        code: { type: string }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        initialCash: {}
        buyThresholdPct: {}
        sellThresholdPct: {}
        orderPct: {}
        slippageBps: {}
    PaperBacktestPolicy:
      type: object
      properties:
        executionModel: { type: string }
        riskModel: { type: string }
        brokerIntegration: { type: string, enum: [disabled] }
        dataSource:
          type: string
          enum: [daily_bars]
        limitBandPct: {}
        slippageBps: {}
        lotSize: { type: integer }
        rules:
          type: array
          items: { type: string }
    PaperBacktestSummary:
      type: object
      properties:
        barCount: { type: integer }
        tradeCount: { type: integer }
        rejectedCount: { type: integer }
        initialCash: {}
        finalCash: {}
        finalMarketValue: {}
        finalEquity: {}
        totalReturnPct: {}
        maxDrawdownPct: {}
    PaperBacktestPoint:
      type: object
      properties:
        tradeDate: { type: string, format: date-time }
        close: {}
        signalPct: {}
        cash: {}
        quantity: { type: integer }
        marketValue: {}
        totalEquity: {}
        dailyReturnPct: {}
        drawdownPct: {}
    PaperBacktestOrder:
      type: object
      properties:
        id: { type: string }
        tradeDate: { type: string, format: date-time }
        code: { type: string }
        side: { type: string, enum: [buy, sell] }
        quantity: { type: integer }
        signalPct: {}
        referencePrice: {}
        filledPrice: {}
        status: { type: string, enum: [suggested, filled, rejected] }
        reason: { type: string }
        grossAmount: {}
        fees: {}
        cashAfter: {}
        positionAfter: { type: integer }
    PaperPerformanceDocument:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id, attributes]
          properties:
            type: { type: string, enum: [paper-performances] }
            id: { type: string }
            attributes:
              $ref: "#/components/schemas/PaperPerformanceAttributes"
    PaperPerformanceAttributes:
      type: object
      properties:
        accountId: { type: integer }
        initialCash: {}
        latestEquity: {}
        latestCash: {}
        latestMarketValue: {}
        unrealizedPnl: {}
        realizedPnl: {}
        totalReturnPct: {}
        maxDrawdownPct: {}
        winRatePct: {}
        fillsCount: { type: integer }
        series:
          type: array
          items:
            $ref: "#/components/schemas/PaperPerformancePoint"
        attribution:
          type: array
          items:
            $ref: "#/components/schemas/PaperAttributionItem"
        riskAlerts:
          type: array
          items:
            $ref: "#/components/schemas/PaperRiskAlert"
        riskSummary:
          $ref: "#/components/schemas/PaperRiskSummary"
    PaperPerformancePoint:
      type: object
      required: [id, accountId, snapshotTime, cash, marketValue, totalEquity, unrealizedPnl, realizedPnl, dailyPnl]
      properties:
        id: { type: integer }
        accountId: { type: integer }
        snapshotTime: { type: string, format: date-time }
        cash: {}
        marketValue: {}
        totalEquity: {}
        unrealizedPnl: {}
        realizedPnl: {}
        dailyPnl: {}
    PaperAttributionItem:
      type: object
      properties:
        code: { type: string }
        symbolName: { type: string, nullable: true }
        quantity: { type: integer }
        costAmount: {}
        marketValue: {}
        weightPct: {}
        unrealizedPnl: {}
        realizedPnl: {}
        totalPnl: {}
        returnPct: {}
        contributionPct: {}
        updatedAt: { type: string, format: date-time, nullable: true }
        source:
          type: string
          enum: [open_position, closed_realized, mixed]
    PaperRiskAlert:
      type: object
      required: [key, severity, title, detail]
      properties:
        key: { type: string }
        severity:
          type: string
          enum: [critical, warning, info]
        title: { type: string }
        detail: { type: string }
        code: { type: string, nullable: true }
        metric: {}
        threshold: {}
    PaperRiskSummary:
      type: object
      properties:
        status:
          type: string
          enum: [ok, watch, critical]
        maxSeverity:
          type: string
          enum: [ok, info, warning, critical]
        alertCount: { type: integer }
        criticalCount: { type: integer }
        warningCount: { type: integer }
        infoCount: { type: integer }
    PaperReplayDocument:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id, attributes]
          properties:
            type: { type: string, enum: [paper-replays] }
            id: { type: string }
            attributes:
              $ref: "#/components/schemas/PaperReplayAttributes"
            relationships:
              type: object
              properties:
                account:
                  $ref: "#/components/schemas/Relationship"
    PaperReplayAttributes:
      type: object
      properties:
        accountId: { type: integer }
        generatedAt: { type: string, format: date-time }
        modelPolicy:
          type: object
          additionalProperties: true
        summary:
          type: object
          additionalProperties: true
        events:
          type: array
          items:
            $ref: "#/components/schemas/PaperReplayEvent"
    PaperReplayEvent:
      type: object
      properties:
        id: { type: string }
        type:
          type: string
          enum: [order, fill, corporate_action]
        time: { type: string, format: date-time }
        code: { type: string }
        summary: { type: string }
        attributes:
          type: object
          additionalProperties: true
    HealthDocument:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/HealthResource"
    HealthResource:
      type: object
      required: [type, id, attributes]
      properties:
        type:
          type: string
          enum: [health-checks]
        id:
          type: string
          enum: [api]
        attributes:
          $ref: "#/components/schemas/HealthAttributes"
    HealthAttributes:
      type: object
      required: [status, app, env]
      properties:
        status:
          type: string
          enum: [ok]
        app:
          type: string
        env:
          type: string
    Resource:
      type: object
      required: [type]
      properties:
        type:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*s$"
        id:
          type: string
        attributes:
          type: object
          additionalProperties: true
        relationships:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Relationship"
        links:
          $ref: "#/components/schemas/Links"
        meta:
          type: object
          additionalProperties: true
    Relationship:
      type: object
      properties:
        data:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/ResourceIdentifier"
            - type: array
              items:
                $ref: "#/components/schemas/ResourceIdentifier"
        links:
          $ref: "#/components/schemas/Links"
        meta:
          type: object
          additionalProperties: true
    ResourceIdentifier:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
        id:
          type: string
        meta:
          type: object
          additionalProperties: true
    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        detail:
          type: string
        field:
          type: string
    Links:
      type: object
      properties:
        self:
          type: string
        next:
          type: string
        prev:
          type: string
