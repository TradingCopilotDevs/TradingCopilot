    post:
      operationId: postMarketWatchlist
      requestBody: { $ref: "#/components/requestBodies/MarketWatchlistUpsertRequest" }
      responses:
        "200": { $ref: "#/components/responses/MarketWatchlistDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /market/watchlist/{itemId}:
