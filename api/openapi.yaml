        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200": { $ref: "#/components/responses/MarketSeriesPointCollectionDocument" }
        "400": { $ref: "#/components/responses/JsonApiErrorDocument" }
  /market/daily/{code}:
